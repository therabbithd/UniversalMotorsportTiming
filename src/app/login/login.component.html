<section class="login">
  <header class="login__header">
    <p class="login__eyebrow">Universal Timing</p>
    <h1>{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
    <p class="login__subtitle">
      {{ 'AUTH.LOGIN.SUBTITLE' | translate }}
    </p>
  </header>

  <form class="login__form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>{{ 'AUTH.LOGIN.EMAIL_LABEL' | translate }}</span>
      <input type="email" [placeholder]="'AUTH.LOGIN.EMAIL_PLACEHOLDER' | translate" formControlName="email"
        [disabled]="isLoading()" />
      <small *ngIf="email?.invalid && (email?.touched || isSubmitted())">
        {{ 'AUTH.LOGIN.ERRORS.INVALID_EMAIL' | translate }}
      </small>
    </label>

    <label class="field">
      <span>{{ 'AUTH.LOGIN.PASSWORD_LABEL' | translate }}</span>
      <input type="password" [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate" formControlName="password"
        [disabled]="isLoading()" />
      <small *ngIf="password?.invalid && (password?.touched || isSubmitted())">
        {{ 'AUTH.LOGIN.ERRORS.REQUIRED_PASSWORD' | translate }}
      </small>
    </label>

    <button type="submit" [disabled]="isLoading()">
      <span *ngIf="!isLoading()">{{ 'AUTH.LOGIN.SUBMIT_BUTTON' | translate }}</span>
      <span *ngIf="isLoading()">{{ 'AUTH.LOGIN.LOADING_BUTTON' | translate }}</span>
    </button>
  </form>

  <footer class="login__footer">
    {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }} <a routerLink="/register">{{ 'AUTH.LOGIN.REGISTER_LINK' | translate }}</a>
  </footer>
</section>
