<section class="register">
  <header class="register__header">
    <p class="register__eyebrow">Universal Timing</p>
    <h1>{{ 'AUTH.REGISTER.TITLE' | translate }}</h1>

  </header>

  <form class="register__form" [formGroup]="registrationForm" (ngSubmit)="submit()" novalidate>
    <!-- Mensaje de éxito -->
    <div class="message message--success" *ngIf="successMessage()">
      <p>{{ successMessage() }}</p>
    </div>

    <!-- Mensaje de error -->
    <div class="message message--error" *ngIf="errorMessage()">
      <p>{{ errorMessage() }}</p>
    </div>

    <label class="field">
      <span>{{ 'AUTH.REGISTER.FULLNAME_LABEL' | translate }}</span>
      <input type="text" [placeholder]="'AUTH.REGISTER.FULLNAME_PLACEHOLDER' | translate" formControlName="fullName"
        [disabled]="isLoading()" />
      <small *ngIf="fullName?.invalid && (fullName?.touched || isSubmitted())">
        {{ 'AUTH.REGISTER.ERRORS.NAME_LENGTH' | translate }}
      </small>
    </label>

    <label class="field">
      <span>{{ 'AUTH.REGISTER.EMAIL_LABEL' | translate }}</span>
      <input type="email" [placeholder]="'AUTH.REGISTER.EMAIL_PLACEHOLDER' | translate" formControlName="email"
        [disabled]="isLoading()" />
      <small *ngIf="email?.invalid && (email?.touched || isSubmitted())">
        {{ 'AUTH.REGISTER.ERRORS.INVALID_EMAIL' | translate }}
      </small>
    </label>

    <div class="field field--split">
      <label>
        <span>{{ 'AUTH.REGISTER.PASSWORD_LABEL' | translate }}</span>
        <input type="password" [placeholder]="'AUTH.REGISTER.PASSWORD_PLACEHOLDER' | translate"
          formControlName="password" [disabled]="isLoading()" />
        <small *ngIf="password?.invalid && (password?.touched || isSubmitted())">
          {{ 'AUTH.REGISTER.ERRORS.PASSWORD_LENGTH' | translate }}
        </small>
      </label>
      <label>
        <span>{{ 'AUTH.REGISTER.CONFIRM_PASSWORD_LABEL' | translate }}</span>
        <input type="password" [placeholder]="'AUTH.REGISTER.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
          formControlName="confirmPassword" [disabled]="isLoading()" />
        <small *ngIf="passwordMismatch()">{{ 'AUTH.REGISTER.ERRORS.PASSWORD_MISMATCH' | translate }}</small>
      </label>
    </div>

    <label class="terms">
      <input type="checkbox" formControlName="acceptTerms" [disabled]="isLoading()" />
      <span>{{ 'AUTH.REGISTER.TERMS' | translate }}</span>
    </label>
    <small class="terms__error"
      *ngIf="registrationForm.get('acceptTerms')?.invalid && (registrationForm.get('acceptTerms')?.touched || isSubmitted())">
      {{ 'AUTH.REGISTER.ERRORS.TERMS_REQUIRED' | translate }}
    </small>

    <button type="submit" [disabled]="isLoading()">
      <span *ngIf="!isLoading()">{{ 'AUTH.REGISTER.SUBMIT_BUTTON' | translate }}</span>
      <span *ngIf="isLoading()">{{ 'AUTH.REGISTER.LOADING_BUTTON' | translate }}</span>
    </button>
  </form>

  <footer class="register__footer">
    {{ 'AUTH.REGISTER.ALREADY_ACCOUNT' | translate }} <a routerLink="/login">{{ 'AUTH.REGISTER.LOGIN_LINK' | translate
      }}</a>
  </footer>
</section>
