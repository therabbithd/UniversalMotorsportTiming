<div class="profile-setup-container">
  <div class="setup-card">
    <div class="setup-header">
      <div class="logo-text">Universal<span>Motorsport</span></div>
      <h1>{{ (isEditMode() ? 'AUTH.PROFILE.SETUP.EDIT_TITLE' : 'AUTH.PROFILE.SETUP.TITLE') | translate }}</h1>
      <p>{{ (isEditMode() ? 'AUTH.PROFILE.SETUP.EDIT_SUBTITLE' : 'AUTH.PROFILE.SETUP.SUBTITLE') | translate }}</p>
    </div>

    <form [formGroup]="setupForm" (ngSubmit)="submit()" class="setup-form">
      <div class="form-grid">
        <!-- Avatar Preview/Upload Placeholder -->
        <!-- Avatar Preview/Upload Placeholder -->
        <div class="avatar-section">
          <div class="avatar-circle" (click)="fileInput.click()">
            <img *ngIf="avatarPreview()" [src]="avatarPreview()" alt="Avatar preview" class="avatar-img">
            <i *ngIf="!avatarPreview()" class="fas fa-user"></i>
            <div *ngIf="isUploading()" class="upload-overlay">
              <span class="loader-spinner"></span>
            </div>
          </div>
          <div class="avatar-input">
            <label for="avatar-upload" class="upload-label">{{ 'AUTH.PROFILE.SETUP.AVATAR_LABEL' | translate }}</label>
            <input #fileInput type="file" id="avatar-upload" (change)="onFileSelected($event)" accept="image/*"
              style="display: none;">
            <button type="button" class="btn-upload" (click)="fileInput.click()">
              {{ 'AUTH.PROFILE.SETUP.UPLOAD_BUTTON' | translate }}
            </button>
            <input type="hidden" formControlName="avatar">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="bio">{{ 'AUTH.PROFILE.SETUP.BIO_LABEL' | translate }}</label>
          <textarea id="bio" formControlName="bio"
            [placeholder]="'AUTH.PROFILE.SETUP.BIO_PLACEHOLDER' | translate"></textarea>
          <div *ngIf="setupForm.get('bio')?.errors?.['maxlength']" class="error-msg">
            {{ 'AUTH.PROFILE.SETUP.ERRORS.BIO_LENGTH' | translate }}
          </div>
        </div>

        <div class="form-group">
          <label for="phone">{{ 'AUTH.PROFILE.SETUP.PHONE_LABEL' | translate }}</label>
          <input type="text" id="phone" formControlName="phone" placeholder="+34 600 000 000">
        </div>

        <div class="form-group">
          <label for="address">{{ 'AUTH.PROFILE.SETUP.ADDRESS_LABEL' | translate }}</label>
          <input type="text" id="address" formControlName="address" placeholder="Calle, Ciudad, País">
        </div>

        <div class="form-group">
          <label for="favoritos">{{ 'AUTH.PROFILE.SETUP.FAVORITE_DRIVER_LABEL' | translate }}</label>
          <app-driver-selector id="favoritos" formControlName="favoritos"></app-driver-selector>
        </div>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn-skip" (click)="skip()" [disabled]="isLoading()">{{
          (isEditMode() ? 'COMMON.CANCEL' : 'AUTH.PROFILE.SETUP.SKIP_BUTTON') | translate }}</button>
        <button type="submit" class="btn-submit" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">{{ 'AUTH.PROFILE.SETUP.SAVE_BUTTON' | translate }}</span>
          <span *ngIf="isLoading()" class="loader"></span>
        </button>
      </div>
    </form>
  </div>
</div>
