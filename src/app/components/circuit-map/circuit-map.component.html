<div class="circuit-map-container">
    <div *ngIf="isLoading" class="loading-map">{{ 'RACE.MAP.LOADING' | translate }}</div>
    <div *ngIf="error" class="error-map">{{ error }}</div>

    <div class="map-wrapper" [class.hidden]="isLoading || error">
        <svg [attr.viewBox]="viewBox" class="f1-svg" preserveAspectRatio="xMidYMid meet">
            <!-- Full Track Outline (Background) -->
            <path [attr.d]="circuitPath" class="track-line-bg"></path>

            <!-- Marshal Sectors (Status Coloring) -->
            <path *ngFor="let sector of sectorPaths" 
                  [attr.d]="sector.path" 
                  [style.stroke]="sector.color" 
                  class="track-sector"></path>

            <!-- Drivers -->
            <g *ngFor="let d of processedDrivers" class="driver-marker"
                [attr.transform]="'translate(' + d.x + ',' + d.y + ')'" [class.off-track]="!d.onTrack">

                <circle r="180" [attr.fill]="d.teamColor" class="driver-circle"></circle>

                <text [attr.y]="d.labelOffsetY" class="driver-label" [attr.fill]="d.teamColor">
                    {{ d.driverCode }}
                </text>
            </g>
        </svg>
    </div>

    <div class="track-info" *ngIf="trackData && !isLoading && !error">
        <span class="circuit-name">{{ trackData.circuitName }}</span>
        <span class="location">{{ trackData.location }}, {{ trackData.countryName }}</span>
    </div>
</div>
